  <style>
    .category-wrapper {
      width: 100%;
      margin: 28px 0 35px;
      overflow: hidden;
    }
    .category-list {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 5px 0 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-list::-webkit-scrollbar {

    }
    .category-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border: 1px solid #444;
      border-radius: 30px;
      background: #1c1c1c;
      color: #eee;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .category-button.active {
      background: #b68d32;
      border-color: #d4ad52;
      color: #111;
    }
    .category-button:active {
      transform: scale(.97);
    }
    #catalogTitle {
      margin-top: 25px;
    }
    .free-card {
      min-width: 0;
      overflow: hidden;
    }
    /* Единое окно для короткого и полного видео */
    .free-thumbnail {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
      border-radius: 10px;
      aspect-ratio: 3 / 4;
    }
    .free-thumbnail img,
    .free-thumbnail video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    .free-thumbnail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      font-size: 15px;
    }
    .free-badge {
      display: inline-block;
      margin: 10px 0 5px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #176b38;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }
    .free-card h3 {
      margin: 5px 0 8px;
    }
    .free-card p {
      color: #aaa;
      line-height: 1.5;
    }
    .free-watch-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #b68a32;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .free-watch-button:active {
      transform: scale(.98);
    }
    .free-watch-button.opened {
      background: #176b38;
    }
    .free-status {
      color: #aaa;
    }
    @media (max-width: 600px) {
      .free-watch-button {
        padding: 10px 6px;
        font-size: 12px;
      }
      .free-card h3 {
        font-size: 14px;
      }
      .free-card p {
        font-size: 12px;
      }
    }
  </style>

<body>

  <main class="container">
    <section class="hero">

</section>
    <div class="category-wrapper">
      <nav class="category-list" id="categoryList" aria-label="Категории видео">
        <button class="category-button active" data-category="all" type="button">
          Все видео
        </button>
        <button class="category-button" data-category="mistress" type="button">
          Госпожа
        </button>
        <button class="category-button" data-category="slave" type="button">

        <button class="category-button" data-category="Cuckold" type="button">

        <button class="category-button" data-category="submission" type="button">

        <button class="category-button" data-category="fetish" type="button">
          Фетиш
        </button>
        <button class="category-button" data-category="feet" type="button">
          Ножки
        </button>
        <button class="category-button" data-category="other" type="button">
          Другое
        </button>
      </nav>
    </div>
    <h2 id="catalogTitle" class="gold-fetish">Все бесплатные видео</h2>
    <p id="status" class="free-status">Загружаем видео...</p>
    <div id="catalog" class="catalog"></div>

  <footer>FETISH VIDEO STORE · 18+</footer>
  <script>
    "use strict";
    const catalog = document.getElementById("catalog");
    const status = document.getElementById("status");
    const catalogTitle = document.getElementById("catalogTitle");
    let allVideos = [];
    let activeCategory = "all";
    const categories = {
      all: "Все бесплатные видео",
      mistress: "Госпожа",
      slave: "Раб",
      Cuckold: "Cuckold",
      submission: "Подчинение",
      fetish: "Фетиш",
      feet: "Ножки",
      other: "Другое"
    };
    const previewObserver = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            const player = entry.target;
            if (player.dataset.fullPlaying === "true") return;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
              player.play().catch(() => {});
            } else {
              player.pause();
            }
          });
        }, {
          threshold: [0, 0.6, 1]
        })
      : null;
    function normalizeCategory(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/ё/g, "е");
    }
    function getVideoCategory(video) {
      const value =
        video.category ||
        video.category_slug ||
        video.theme ||
        "";
      const normalized = normalizeCategory(value);
      const aliases = {
        "госпожа": "mistress",
        "mistress": "mistress",
        "раб": "slave",
        "slave": "slave",
        "cuckold": "Cuckold",
        "domination": "domination",
        "подчинение": "submission",
        "submission": "submission",
        "фетиш": "fetish",
        "fetish": "fetish",
        "ножки": "feet",
        "ноги": "feet",
        "feet": "feet",
        "другое": "other",
        "other": "other"
      };
      return aliases[normalized] || normalized;
    }
    function updateCategoryButtons() {
      document.querySelectorAll(".category-button").forEach(button => {
        const active = button.dataset.category === activeCategory;
        button.classList.toggle("active", active);
        if (active) {
          button.setAttribute("aria-current", "true");
        } else {
          button.removeAttribute("aria-current");
        }
      });
      catalogTitle.textContent = categories[activeCategory];
    }
    function stopOtherFullVideos(currentPlayer) {
      document.querySelectorAll(
        '.free-thumbnail video[data-full-playing="true"]'
      ).forEach(player => {
        if (player === currentPlayer) return;
        player.pause();
        player.dataset.fullPlaying = "false";
        const card = player.closest(".free-card");
        const button = card?.querySelector(".free-watch-button");
        if (player.dataset.previewUrl) {
          player.src = player.dataset.previewUrl;
          player.muted = true;
          player.loop = true;
          player.controls = false;
          player.load();
          if (button) {
            button.textContent = "Смотреть полностью";
            button.classList.remove("opened");
          }
        }
      });
    }
    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "free-card";
      const thumbnail = document.createElement("div");
      thumbnail.className = "free-thumbnail";
      const previewUrl = video.preview_url || "";
      const videoUrl = video.video_url || video.url || "";
      let player = null;
      if (previewUrl) {
        // Короткое видео-превью
        player = document.createElement("video");
        player.src = previewUrl;
        player.muted = true;
        player.defaultMuted = true;
        player.autoplay = true;
        player.loop = true;
        player.playsInline = true;
        player.preload = "metadata";
        player.controls = false;
        player.dataset.previewUrl = previewUrl;
        player.dataset.fullPlaying = "false";
        thumbnail.appendChild(player);
        if (previewObserver) {
          previewObserver.observe(player);
        } else {
          player.play().catch(() => {});
        }
      } else if (video.thumbnail_url) {
        const img = document.createElement("img");
        img.src = video.thumbnail_url;
        img.alt = video.title || "Бесплатное видео";
        img.loading = "lazy";
        thumbnail.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "free-thumbnail-placeholder";
        placeholder.textContent = "Бесплатное видео";
        thumbnail.appendChild(placeholder);
      }
      const badge = document.createElement("span");
      badge.className = "free-badge";
      badge.textContent = "БЕСПЛАТНО";
      const title = document.createElement("h3");
      title.textContent = video.title || "Без названия";
      const description = document.createElement("p");
      description.textContent = video.description || "";
      const button = document.createElement("button");
      button.className = "free-watch-button";
      button.type = "button";
      button.textContent = "Смотреть полностью";
      // Полное видео запускается в том же окне,
      // где показывалось короткое превью.
      button.addEventListener("click", async () => {
        if (!videoUrl) {
          status.textContent =
            "Ссылка на полное видео пока недоступна.";
          return;
        }
        stopOtherFullVideos(player);
        if (!player) {
          player = document.createElement("video");
          player.playsInline = true;
          player.preload = "metadata";
          thumbnail.replaceChildren(player);
        }
        if (previewObserver) {
          previewObserver.unobserve(player);
        }
        player.pause();
        player.dataset.fullPlaying = "true";
        player.src = videoUrl;
        player.muted = false;
        player.loop = false;
        player.controls = true;
        player.autoplay = true;
        player.load();
        button.textContent = "Видео открыто";
        button.classList.add("opened");
        try {
          await player.play();
        } catch (error) {
          player.controls = true;
          console.log("Нажмите Play для запуска видео:", error);
        }
      });
      card.append(
        thumbnail,
        badge,
        title,
        description,
        button
      );
      return card;
    }
    function renderVideos() {
      catalog.replaceChildren();
      const videos = activeCategory === "all"
        ? allVideos
        : allVideos.filter(video => {
            return getVideoCategory(video) === activeCategory;
          });
      catalogTitle.textContent = categories[activeCategory];
      if (!videos.length) {
        status.textContent =
          "В этой категории пока нет бесплатных видео.";
        return;
      }
      status.textContent = "Найдено видео: " + videos.length;
      videos.forEach(video => {
        catalog.appendChild(createVideoCard(video));
      });
    }
    async function loadVideos() {
      try {
        const response = await fetch("/api/free/videos");
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Ошибка загрузки");
        }
        allVideos = Array.isArray(result)
          ? result
          : (result.videos || []);
        renderVideos();
      } catch (error) {
        console.error(error);
        status.textContent =
          "Не удалось загрузить бесплатные видео. Проверь сервер и Supabase.";
      }
    }
    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        updateCategoryButtons();
        renderVideos();
      });
    });
    // Боковое меню
    (function () {
      const menuButton = document.getElementById("menuButton");
      const closeButton = document.getElementById("closeMenu");
      const overlay = document.getElementById("menuOverlay");
      const sideMenu = document.getElementById("sideMenu");
      if (!menuButton || !closeButton || !overlay || !sideMenu) return;
      function openMenu() {
        document.body.classList.add("menu-open");
        menuButton.setAttribute("aria-expanded", "true");
        sideMenu.setAttribute("aria-hidden", "false");
      }
      function closeMenu() {
        document.body.classList.remove("menu-open");
        menuButton.setAttribute("aria-expanded", "false");
        sideMenu.setAttribute("aria-hidden", "true");
      }
      menuButton.addEventListener("click", openMenu);
      closeButton.addEventListener("click", closeMenu);
      overlay.addEventListener("click", closeMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeMenu();
        }
      });
    })();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        document.querySelectorAll(".free-thumbnail video").forEach(player => {
          player.pause();
        });
      } else {
        document.querySelectorAll(
          '.free-thumbnail video[data-full-playing="false"]'
        ).forEach(player => {
          if (!previewObserver) {
            player.play().catch(() => {});
          }
        });
      }
    });
    updateCategoryButtons();
    loadVideos();
  </script>
</body>
