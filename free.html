<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Бесплатные видео — FETISH VIDEO STORE</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    .free-publish-button {
      display: inline-block;
      padding: 10px 15px;
      border-radius: 9px;
      background: #b68a32;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      white-space: nowrap;
    }
    .free-badge {
      display: inline-block;
      padding: 5px 10px;
      margin: 8px 0;
      border-radius: 20px;
      background: #176b38;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }
    .free-video-player {
      display: none;
      margin-top: 12px;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .free-video-player.active {
      display: block;
    }
    .free-video-player video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }
    .free-watch-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #b68a32;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .free-empty {
      padding: 30px 15px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>
<body>
<header class="header">
  <a class="logo" href="/">
    <span>Y</span><span class="gold-fetish">-FETISH</span>
    <small>VIDEO STORE</small>
  </a>
  <nav>
    <a href="/">Платный каталог</a>
    <a href="/admin.html" class="free-publish-button">＋ Опубликовать видео</a>
  </nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Бесплатные видео</h1>
    <p>Смотри полные видео бесплатно.</p>
  </section>
  <section class="categories" id="categories">
    <button class="category active" data-category="all">Все</button>
    <button class="category" data-category="mistress">Госпожа</button>
    <button class="category" data-category="slave">Раб</button>
    <button class="category" data-category="domination">Доминирование</button>
    <button class="category" data-category="submission">Подчинение</button>
    <button class="category" data-category="fetish">Фетиш</button>
    <button class="category" data-category="feet">Ножки</button>
    <button class="category" data-category="other">Другое</button>
  </section>
  <h2 id="catalogTitle">Все бесплатные видео</h2>
  <p id="status">Загружаем видео...</p>
  <section id="catalog" class="catalog"></section>
</main>
<footer>
  <a href="/">Вернуться в платный каталог</a>
</footer>
<script>
"use strict";
const catalog = document.getElementById("catalog");
const status = document.getElementById("status");
const catalogTitle = document.getElementById("catalogTitle");
let allVideos = [];
let activeCategory = "all";
const categoryNames = {
  all: "Все бесплатные видео",
  mistress: "Госпожа",
  slave: "Раб",
  domination: "Доминирование",
  submission: "Подчинение",
  fetish: "Фетиш",
  feet: "Ножки",
  other: "Другое"
};
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}
function createVideoCard(video) {
  const card = document.createElement("article");
  card.className = "video-card";
  const title = escapeHtml(video.title || "Без названия");
  const description = escapeHtml(video.description || "");
  const videoUrl = video.video_url || video.url || "";
  card.innerHTML = `
    <div class="thumbnail">
      ${
        video.thumbnail_url
          ? `<img src="${escapeHtml(video.thumbnail_url)}"
                 alt="${title}" loading="lazy">`
          : `<div class="free-empty">Бесплатное видео</div>`
      }
    </div>
    <div class="free-badge">БЕСПЛАТНО</div>
    <h3>${title}</h3>
    <p>${description}</p>
    <button class="free-watch-button" type="button">
      Смотреть полностью
    </button>
    <div class="free-video-player">
      <video controls playsinline preload="metadata"></video>
    </div>
  `;
  const button = card.querySelector(".free-watch-button");
  const playerBox = card.querySelector(".free-video-player");
  const player = playerBox.querySelector("video");
  button.addEventListener("click", async () => {
    if (!videoUrl) {
      status.textContent = "Ссылка на полное видео пока недоступна.";
      return;
    }
    document.querySelectorAll(".free-video-player.active").forEach(box => {
      if (box !== playerBox) {
        box.classList.remove("active");
        const oldPlayer = box.querySelector("video");
        oldPlayer.pause();
        oldPlayer.removeAttribute("src");
        oldPlayer.load();
      }
    });
    playerBox.classList.add("active");
    if (!player.src) {
      player.src = videoUrl;
    }
    try {
      await player.play();
    } catch (_) {
      player.controls = true;
    }
    button.textContent = "Видео открыто";
  });
  return card;
}
function renderVideos() {
  catalog.innerHTML = "";
  const videos = activeCategory === "all"
    ? allVideos
    : allVideos.filter(video => video.category === activeCategory);
  catalogTitle.textContent = categoryNames[activeCategory];
  if (!videos.length) {
    status.textContent = "В этой категории пока нет бесплатных видео.";
    return;
  }
  status.textContent = "Найдено видео: " + videos.length;
  videos.forEach(video => {
    catalog.appendChild(createVideoCard(video));
  });
}
async function loadVideos() {
  try {
    const response = await fetch("/api/free/videos");
    const result = await response.json();
    if (!response.ok) {
      throw new Error(result.error || "Ошибка загрузки");
    }
    allVideos = Array.isArray(result)
      ? result
      : (result.videos || []);
    renderVideos();
  } catch (error) {
    status.textContent =
      "Не удалось загрузить бесплатные видео: " + error.message;
  }
}
document.querySelectorAll("[data-category]").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll("[data-category]").forEach(item => {
      item.classList.remove("active");
    });
    button.classList.add("active");
    activeCategory = button.dataset.category;
    renderVideos();
  });
});
loadVideos();
</script>
</body>
</html>
