<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бесплатные видео — FETISH VIDEO STORE</title>
  <meta name="description" content="Бесплатные полные видео FETISH VIDEO STORE.">
  <meta name="robots" content="index,follow">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    /* Категории — оформление как на главной */
    .category-wrapper {
      width: 100%;
      margin: 28px 0 35px;
      overflow: hidden;
    }
    .category-list {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 5px 0 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .category-list::-webkit-scrollbar {
      display: none;
    }
    .category-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border: 1px solid #444;
      border-radius: 30px;
      background: #1c1c1c;
      color: #eee;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .category-button.active {
      background: #b68d32;
      border-color: #d4ad52;
      color: #111;
    }
    .category-button:active {
      transform: scale(.97);
    }
    #catalogTitle {
      margin-top: 25px;
    }
    /* Бесплатные карточки */
    .free-card {
      min-width: 0;
      overflow: hidden;
    }
    .free-thumbnail {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
      border-radius: 10px;
    }
    .free-thumbnail img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }
    .free-thumbnail-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      color: #aaa;
      font-size: 15px;
    }
    .free-badge {
      display: inline-block;
      margin: 10px 0 5px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #176b38;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
    }
    .free-card h3 {
      margin: 5px 0 8px;
    }
    .free-card p {
      color: #aaa;
      line-height: 1.5;
    }
    .free-watch-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: #b68a32;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .free-video-player {
      display: none;
      width: 100%;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }
    .free-video-player.active {
      display: block;
    }
    .free-video-player video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }
    .free-status {
      color: #aaa;
    }
    @media (max-width: 600px) {
      .free-watch-button {
        padding: 10px 6px;
        font-size: 12px;
      }
      .free-card h3 {
        font-size: 14px;
      }
      .free-card p {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="logo" href="/">
      <span>Y</span><span class="gold-fetish">-FETISH</span>
      <small>VIDEO STORE</small>
    </a>
<nav class="header-nav">
  <button
    class="menu-button"
    id="menuButton"
    type="button"
    aria-label="Открыть меню"
    aria-expanded="false"
  >☰</button>
</nav>
<div class="menu-overlay" id="menuOverlay"></div>
<aside class="side-menu" id="sideMenu" aria-hidden="true">
  <div class="side-menu-header">
    <span>МЕНЮ</span>
    <button id="closeMenu" type="button" aria-label="Закрыть меню">✕</button>
  </div>
  <a href="/">Каталог видео</a>
  <a href="/admin.html">Для администраторов</a>
  <a href="/free.html">Бесплатные видео</a>
</aside>
  </header>
  <main class="container">
<section class="hero">
  <h1>FETISH VIDEO FREE</h1>
  <p>Каталог видео для совершеннолетних — 18+</p>
</section>
<div class="category-wrapper">
  <nav class="category-list" id="categoryList" aria-label="Категории видео">
    <button class="category-button active" data-category="all" type="button">
      Все видео
    </button>
    <button class="category-button" data-category="mistress" type="button">
      Госпожа
    </button>
    <button class="category-button" data-category="slave" type="button">
      Раб
    </button>
    <button class="category-button" data-category="domination" type="button">
      Доминирование
    </button>
    <button class="category-button" data-category="submission" type="button">
      Подчинение
    </button>
    <button class="category-button" data-category="fetish" type="button">
      Фетиш
    </button>
    <button class="category-button" data-category="feet" type="button">
      Ножки
    </button>
    <button class="category-button" data-category="other" type="button">
      Другое
    </button>
  </nav>
</div>
<h2 id="catalogTitle">Все бесплатные видео</h2>
<p id="status" class="free-status">Загружаем видео...</p>
<div id="catalog" class="catalog"></div>
  </main>
  <footer>FETISH VIDEO STORE · 18+</footer>
  <script>
    "use strict";
    const catalog = document.getElementById("catalog");
    const status = document.getElementById("status");
    const catalogTitle = document.getElementById("catalogTitle");
    let allVideos = [];
    let activeCategory = "all";
    const categories = {
      all: "Все бесплатные видео",
      mistress: "Госпожа",
      slave: "Раб",
      domination: "Доминирование",
      submission: "Подчинение",
      fetish: "Фетиш",
      feet: "Ножки",
      other: "Другое"
    };
    function normalizeCategory(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/ё/g, "е");
    }
    function getVideoCategory(video) {
      const value =
        video.category ||
        video.category_slug ||
        video.theme ||
        "";
      const normalized = normalizeCategory(value);
      const aliases = {
        "госпожа": "mistress",
        "mistress": "mistress",
        "раб": "slave",
        "slave": "slave",
        "доминирование": "domination",
        "domination": "domination",
        "подчинение": "submission",
        "submission": "submission",
        "фетиш": "fetish",
        "fetish": "fetish",
        "ножки": "feet",
        "ноги": "feet",
        "feet": "feet",
        "другое": "other",
        "other": "other"
      };
      return aliases[normalized] || normalized;
    }
    function updateCategoryButtons() {
      document.querySelectorAll(".category-button").forEach(button => {
        const active = button.dataset.category === activeCategory;
        button.classList.toggle("active", active);
        if (active) {
          button.setAttribute("aria-current", "true");
        } else {
          button.removeAttribute("aria-current");
        }
      });
      catalogTitle.textContent = categories[activeCategory];
    }
    function createVideoCard(video) {
      const card = document.createElement("article");
      card.className = "free-card";
      const thumbnail = document.createElement("div");
      thumbnail.className = "free-thumbnail";
      if (video.thumbnail_url) {
        const img = document.createElement("img");
        img.src = video.thumbnail_url;
        img.alt = video.title || "Бесплатное видео";
        img.loading = "lazy";
        thumbnail.appendChild(img);
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "free-thumbnail-placeholder";
        placeholder.textContent = "Бесплатное видео";
        thumbnail.appendChild(placeholder);
      }
      const badge = document.createElement("span");
      badge.className = "free-badge";
      badge.textContent = "БЕСПЛАТНО";
      const title = document.createElement("h3");
      title.textContent = video.title || "Без названия";
      const description = document.createElement("p");
      description.textContent = video.description || "";
      const button = document.createElement("button");
      button.className = "free-watch-button";
      button.type = "button";
      button.textContent = "Смотреть полностью";
      const playerBox = document.createElement("div");
      playerBox.className = "free-video-player";
      const player = document.createElement("video");
      player.controls = true;
      player.playsInline = true;
      player.preload = "metadata";
      playerBox.appendChild(player);
      const videoUrl = video.video_url || video.url || "";
      button.addEventListener("click", async () => {
        if (!videoUrl) {
          status.textContent =
            "Ссылка на полное видео пока недоступна.";
          return;
        }
        document.querySelectorAll(".free-video-player.active").forEach(box => {
          if (box !== playerBox) {
            box.classList.remove("active");
            const oldPlayer = box.querySelector("video");
            oldPlayer.pause();
            oldPlayer.removeAttribute("src");
            oldPlayer.load();
          }
        });
        playerBox.classList.add("active");
        if (!player.src) {
          player.src = videoUrl;
        }
        try {
          await player.play();
        } catch (_) {
          player.controls = true;
        }
        button.textContent = "Видео открыто";
      });
      player.addEventListener("ended", () => {
        button.textContent = "Смотреть полностью";
      });
      card.append(
        thumbnail,
        badge,
        title,
        description,
        button,
        playerBox
      );
      return card;
    }
    function renderVideos() {
      catalog.replaceChildren();
      const videos = activeCategory === "all"
        ? allVideos
        : allVideos.filter(video => {
            return getVideoCategory(video) === activeCategory;
          });
      catalogTitle.textContent = categories[activeCategory];
      if (!videos.length) {
        status.textContent =
          "В этой категории пока нет бесплатных видео.";
        return;
      }
      status.textContent = "Найдено видео: " + videos.length;
      videos.forEach(video => {
        catalog.appendChild(createVideoCard(video));
      });
    }
    async function loadVideos() {
      try {
        const response = await fetch("/api/free/videos");
        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || "Ошибка загрузки");
        }
        allVideos = Array.isArray(result)
          ? result
          : (result.videos || []);
        renderVideos();
      } catch (error) {
        console.error(error);
        status.textContent =
          "Не удалось загрузить бесплатные видео. Проверь сервер и Supabase.";
      }
    }
    document.querySelectorAll("[data-category]").forEach(button => {
      button.addEventListener("click", () => {
        activeCategory = button.dataset.category;
        updateCategoryButtons();
        renderVideos();
      });
    });
    // Боковое меню — как на index.html
    (function () {
      const menuButton = document.getElementById("menuButton");
      const closeButton = document.getElementById("closeMenu");
      const overlay = document.getElementById("menuOverlay");
      const sideMenu = document.getElementById("sideMenu");
      if (!menuButton || !closeButton || !overlay || !sideMenu) return;
      function openMenu() {
        document.body.classList.add("menu-open");
        menuButton.setAttribute("aria-expanded", "true");
        sideMenu.setAttribute("aria-hidden", "false");
      }
      function closeMenu() {
        document.body.classList.remove("menu-open");
        menuButton.setAttribute("aria-expanded", "false");
        sideMenu.setAttribute("aria-hidden", "true");
      }
      menuButton.addEventListener("click", openMenu);
      closeButton.addEventListener("click", closeMenu);
      overlay.addEventListener("click", closeMenu);
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeMenu();
        }
      });
    })();
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        document.querySelectorAll(".free-video-player video").forEach(player => {
          player.pause();
        });
      }
    });
    updateCategoryButtons();
    loadVideos();
  </script>
</body>
</html>
